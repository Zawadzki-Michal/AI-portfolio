<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="narrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2A313C" stop-opacity="1"/>
      <stop offset="1" stop-color="#4FD1C5" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0E1116"/>

  <!-- brand mark, top-left -->
  <circle cx="90" cy="86" r="10" fill="#F2A93B"/>
  <text x="114" y="93" font-family="monospace" font-size="22" letter-spacing="2" fill="#ECE8E1" fill-opacity="0.6">mz.status / log</text>

  <!-- left panel: junior, muted, thin opening -->
  <rect x="80" y="150" width="440" height="300" rx="10" fill="none" stroke="#2A313C" stroke-width="2"/>
  <circle cx="112" cy="182" r="6" fill="#2A313C"/>
  <circle cx="132" cy="182" r="6" fill="#2A313C"/>
  <circle cx="152" cy="182" r="6" fill="#2A313C"/>
  <text x="112" y="230" font-family="monospace" font-size="22" fill="#ECE8E1" fill-opacity="0.45">$ junior --apply</text>
  <text x="112" y="264" font-family="monospace" font-size="18" fill="#ECE8E1" fill-opacity="0.3">postings: too few to measure</text>
  <text x="112" y="292" font-family="monospace" font-size="18" fill="#ECE8E1" fill-opacity="0.3">applications avg: 59-146</text>
  <text x="112" y="320" font-family="monospace" font-size="18" fill="#ECE8E1" fill-opacity="0.3">salary range: n/a</text>
  <text x="112" y="410" font-family="monospace" font-size="16" fill="#ECE8E1" fill-opacity="0.35">the door barely open</text>

  <!-- right panel: senior, live -->
  <rect x="680" y="150" width="440" height="300" rx="10" fill="none" stroke="#4FD1C5" stroke-width="2"/>
  <circle cx="712" cy="182" r="6" fill="#4FD1C5"/>
  <circle cx="732" cy="182" r="6" fill="#4FD1C5"/>
  <circle cx="752" cy="182" r="6" fill="#4FD1C5"/>
  <text x="712" y="230" font-family="monospace" font-size="22" fill="#ECE8E1">$ senior --apply</text>
  <text x="712" y="264" font-family="monospace" font-size="18" fill="#4FD1C5">postings: plenty</text>
  <text x="712" y="292" font-family="monospace" font-size="18" fill="#4FD1C5">applications avg: 3-5</text>
  <text x="712" y="320" font-family="monospace" font-size="18" fill="#4FD1C5">salary range: 25-30k+ PLN</text>
  <text x="712" y="410" font-family="monospace" font-size="16" fill="#ECE8E1" fill-opacity="0.55">nobody arrives without one</text>

  <!-- narrowing pipeline connecting them -->
  <path d="M520 285 L680 260 L680 340 L520 315 Z" fill="url(#narrow)" opacity="0.8"/>
  <path d="M672 300 L648 288 L648 312 Z" fill="#4FD1C5"/>

  <!-- three pillars, bottom -->
  <g font-family="monospace" font-size="18" fill="#ECE8E1" fill-opacity="0.7">
    <rect x="80" y="500" width="140" height="44" rx="22" fill="none" stroke="#2A313C" stroke-width="1.5"/>
    <text x="150" y="528" text-anchor="middle">devops</text>

    <rect x="240" y="500" width="120" height="44" rx="22" fill="none" stroke="#2A313C" stroke-width="1.5"/>
    <text x="300" y="528" text-anchor="middle">ai</text>

    <rect x="380" y="500" width="140" height="44" rx="22" fill="none" stroke="#2A313C" stroke-width="1.5"/>
    <text x="450" y="528" text-anchor="middle">career</text>
  </g>

  <text x="1120" y="565" font-family="monospace" font-size="18" fill="#F2A93B" text-anchor="end" opacity="0.85">#devops #ai #career</text>
</svg>
