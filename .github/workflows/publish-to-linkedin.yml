name: Publish new posts to LinkedIn

on:
  push:
    branches: [main]
    paths:
      - "posts/**"
  workflow_dispatch:
    inputs:
      post_slug:
        description: "Post folder name to (re)publish manually, e.g. 2026-07-26-my-post. Leave empty for a normal run."
        required: false
        type: string

concurrency:
  group: publish-to-linkedin-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish new posts
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          GITHUB_BASE_SHA: ${{ github.event.before }}
          GITHUB_HEAD_SHA: ${{ github.event.after }}
          POST_SLUG: ${{ github.event.inputs.post_slug }}
        run: npm run publish-linkedin
